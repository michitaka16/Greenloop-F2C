name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          # Current stable at time of writing. Pinned so CI is reproducible;
          # bump deliberately and verify uv.lock still resolves.
          version: "0.5.18"
          enable-cache: true

      - name: Pin Python
        run: uv python install 3.12

      - name: Install OpenMP runtime (libgomp)
        run: sudo apt-get update && sudo apt-get install -y libgomp1

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      # ML-heavy image: xgboost + torch + ortools + shap + stable-baselines3
      # combined blow past the default ~14 GB runner disk. Clear space for
      # unused tooling (Haskell, Android SDK, .NET, CodeQL) before the build.
      - name: Free disk space on runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false      # keep docker images — we're about to build one
          swap-storage: false

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: adopt-a-kale:ci
          platforms: linux/amd64
          # GHA cache backend (type=gha) has been flaky since its v1→v2
          # migration; disable it until stability returns. Rebuild time is
          # acceptable (~2 min cold) for a two-job CI pipeline.
          cache-from: ""
          cache-to: ""
