[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "greenloop-farm-os"
version = "0.1.0"
description = "3-layer AI pipeline for Singapore vertical hydroponic farming"
authors = [
    {name = "GreenLoop Team", email = "team@greenloop.sg"}
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # Layer 1: Demand Forecasting
    "xgboost>=2.0",
    "scikit-learn>=1.4",
    "shap>=0.45",
    # Layer 2: Constraint Optimization
    "ortools>=9.9",
    # Layer 3: RL Environment Control
    "stable-baselines3>=2.3",
    "gymnasium>=1.0",
    # Frontend
    "streamlit>=1.38",
    "plotly>=5.22",
    # Data
    "pandas>=2.2",
    "numpy>=1.26",
    # Layer 4: UMAP for dimensionality reduction
    "umap-learn>=0.5",
    # Layer 5: RAG — ChromaDB vector store + sentence-transformers embeddings
    "chromadb>=0.4",
    "sentence-transformers>=3.0",
    # Utilities
    "python-dotenv>=1.0.0",
    # LLM clients — OpenAI SDK talks to OpenAI + Z.ai (OpenAI-compatible);
    # Anthropic SDK talks to MiniMax via its Anthropic-compatible endpoint.
    "openai>=1.50",
    "anthropic>=0.40",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "timm>=1.0.26",
    "pillow>=12.2.0",
    "opencv-python-headless>=4.13.0.92",
]

[project.scripts]
greenloop = "greenloop.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.2.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*", ".*", "__pycache__*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
# tests/sdk/ contains a standalone Kailash SDK validator script, not pytest tests

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "playwright>=1.58.0",
    "py>=1.11.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
]
