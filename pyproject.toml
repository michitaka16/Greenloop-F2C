[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "greenloop-farm-os"
version = "0.1.0"
description = "3-layer AI pipeline for Singapore vertical hydroponic farming"
authors = [
    {name = "GreenLoop Team", email = "team@greenloop.sg"}
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # Layer 1: Demand Forecasting
    "xgboost>=2.0",
    "scikit-learn>=1.4",
    "shap>=0.45",
    # Layer 2: Constraint Optimization
    "ortools>=9.9",
    # Layer 3: RL Environment Control
    "stable-baselines3>=2.3",
    "gymnasium>=1.0",
    # Frontend
    "streamlit>=1.38",
    "plotly>=5.22",
    # Data
    "pandas>=2.2",
    "numpy>=1.26",
    # Utilities
    "python-dotenv>=1.0.0",
]

[project.scripts]
greenloop = "greenloop.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.2.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*", ".*", "__pycache__*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
# tests/sdk/ contains a standalone Kailash SDK validator script, not pytest tests

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
